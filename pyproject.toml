[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otio-fdl"
version = "0.1.0.dev0"
authors = [
  { name="Tom Mitchell" },
]
description = "Carry ASC Framing Decision List (FDL) data in OpenTimelineIO files"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0 OR MIT"}
dependencies = [
    "opentimelineio>=0.16",
    "jsonschema>=4.18",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
keywords = ["film", "tv", "editing", "editorial", "vfx", "framing", "fdl", "asc", "otio", "otio-plugin"]

[project.optional-dependencies]
native = ["asc-fdl>=1.0.2"]
dev = ["pytest>=7"]

[project.urls]
"Homepage" = "https://github.com/directfilm/otio-fdl"
"Bug Tracker" = "https://github.com/directfilm/otio-fdl/issues"

[project.entry-points."opentimelineio.plugins"]
otio_fdl = "otio_fdl"

[tool.hatch.build.targets.sdist]
# Ensure the sdist includes a setup.py for older pip versions
support-legacy = true
exclude = [".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/otio_fdl"]
