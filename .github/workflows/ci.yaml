name: Run tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  test-plugin:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        otio-constraint: [""]
        include:
          # guard the declared dependency floor (find_clips needs 0.16)
          - python-version: "3.9"
            os: ubuntu-latest
            otio-constraint: "opentimelineio==0.16.*"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" flake8 ${{ matrix.otio-constraint }}

      - name: Lint with flake8
        run: flake8 --show-source --statistics

      - name: Test with pytest
        run: python -m pytest -v
